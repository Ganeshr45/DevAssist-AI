[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devassist-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "pgvector>=0.3,<1",
  "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3",
  "python-multipart>=0.0.9,<1", "redis>=5,<6", "httpx>=0.27,<1", "alembic>=1.13,<2",
  "pypdf>=5,<6", "python-docx>=1.1,<2",
  "boto3>=1.35,<2",
  "arq>=0.26,<1",
  "prometheus-client>=0.21,<1", "structlog>=24.4,<26",
  "sentry-sdk[fastapi]>=2.18,<3", "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1", "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "aiosqlite>=0.20,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
